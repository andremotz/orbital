name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pure-Python path, with nothing installed but the core dependency.
  # The Rust parity tests are skipped here; the `rust` job runs them.
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core dependencies only
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover tests

  # The Rust kernel: lint, build, hold it to the Python reference, and verify
  # the missions with it -- the path targeting.py and verification.py use.
  rust:
    name: Rust kernel, Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_kernel
      - name: Install core dependencies only
        run: python -m pip install -e .

      # PyO3 builds against whichever interpreter PYO3_PYTHON names; without
      # it, it might pick a different Python than the one that imports the
      # module later.
      - name: rustfmt
        working-directory: rust_kernel
        run: cargo fmt --check
      - name: clippy
        working-directory: rust_kernel
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build the kernel
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./build_rust_kernel.sh

      # ORBITAL_REQUIRE_RUST turns the skip of the parity tests into a
      # failure, so a kernel that does not build or import cannot pass.
      - name: Unit tests, parity tests required
        env:
          ORBITAL_REQUIRE_RUST: "1"
        run: python -m unittest discover tests

      - name: Mission verification
        run: |
          status=0
          for path in data/scenarios/*.json; do
            scenario="$(basename "$path" .json)"
            echo "::group::$scenario"
            python verification.py "$scenario" || status=1
            echo "::endgroup::"
          done
          exit "$status"
