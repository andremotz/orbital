[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital"
version = "0.1.0"
description = "N-body simulator that flies real lunar missions against JPL Horizons ephemerides"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# matplotlib viewers, make_figures.py and make_animations.py
# (animations additionally need ffmpeg on the PATH)
viz = ["matplotlib>=3.5"]
# the pygame viewers main.py and main_rust_accelerated.py
pygame = ["pygame>=2.0"]
# the target search in targeting.py
targeting = ["scipy>=1.11"]
# linting and formatting; pinned, so a ruff release cannot turn CI red
lint = ["ruff==0.17.6"]
# everything needed to run every script, the test suite and the linters
dev = ["orbital[viz,pygame,targeting,lint]"]

[project.urls]
Repository = "https://github.com/andremotz/orbital"

# The code is not packaged yet: it runs from the checkout, and its top-level
# packages (`data`, `models`, ...) are too generic to install into
# site-packages. Until the package layout lands (docs/work-items.md, WI-005)
# this file only declares metadata and dependencies, and installing it
# installs nothing but those.
[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
target-version = "py310"
# The Rust kernel's build output and the virtual environments are not ours
extend-exclude = ["rust_kernel/target"]

[tool.ruff.lint]
# Listed explicitly: without a list, recent ruff versions enable a much
# broader default set than the classic pyflakes/pycodestyle one.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade, down to target-version
    "B",   # bugbear
]
ignore = [
    # zip(strict=True) would change behaviour -- a length mismatch would
    # raise instead of truncating. Worth deciding per call, not in a lint pass.
    "B905",
]
